<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f1;color:#243b2e;font:16px/1.7 system-ui,sans-serif}main{max-width:480px;margin:7vh auto;padding:28px}article{background:white;border-radius:24px;padding:28px;box-shadow:0 12px 45px #173b2510}small{color:#63806a}h1{font-size:25px;margin:8px 0 20px}#price{font-size:44px;font-weight:800;margin:12px 0}input,button{font:inherit;width:100%;padding:14px;border-radius:12px}input{border:1px solid #bdd0bd;margin-bottom:12px}button{background:#275b3c;color:white;border:0;cursor:pointer;margin-top:10px}button:disabled{opacity:.45;cursor:default}.quiet{background:transparent;color:#45644e;font-size:14px}#message{white-space:pre-wrap;color:#a03924}#result{white-space:pre-wrap}.seed{font-size:42px;display:inline-block}body.done .seed{animation:pop .65s ease-in-out 3}@keyframes pop{50%{transform:translateY(-14px) rotate(8deg)}}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main><article><small>学習塾SeeD · 自習ポイント</small><div class="seed" aria-hidden="true">🌱</div><h1 id="heading">お菓子と交換</h1><p id="message" role="status">読み込み中…</p><form id="login" hidden><label for="pass">生徒用パスワード</label><input id="pass" type="password" autocomplete="current-password" maxlength="6" required placeholder="塾からお渡しした6文字"><button id="loginButton">ログイン</button><small>自分のスマホで利用してください。保護者用パスワードでは交換できません。</small></form><section id="confirm" hidden><p id="student"></p><div id="price"></div><p id="reward"></p><p id="balance"></p><button id="exchange">交換する</button><p><small>交換完了画面を確認してから、お菓子を1個取ってください。</small></p></section><section id="complete" hidden><div id="result"></div><small>この画面が今回の交換完了の合図です。</small></section><button class="quiet" id="retry" hidden>確認画面を読み込み直す</button><button class="quiet" id="logout" hidden>別の生徒でログイン</button></article></main><script>
const rewardId=new URLSearchParams(location.search).get('reward')||'';
const $=id=>document.getElementById(id);let token='',ticket='',busy=false;
const store={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},remove(k){try{localStorage.removeItem(k)}catch(e){}}};
let device=store.get('seedSnackDevice');if(!device){device=crypto.randomUUID();store.set('seedSnackDevice',device)}
const API='https://script.google.com/macros/s/AKfycbztDdOm_W6RlbxVj-TfG7zxjxhspaTkaGoDvY2qqy8o_enAMRWbtQi9RGNRyndZNLfE/exec';
async function rpc(fn,...args){const response=await fetch(API,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({snackAction:fn,args})});if(!response.ok)throw Error('通信を確認できませんでした。');return response.json();}
function msg(s){$('message').textContent=s||''}function pendingKey(){return 'seedSnackPending:'+rewardId}
function loginView(){token='';ticket='';store.remove('seedSnackToken');$('login').hidden=false;$('confirm').hidden=true;$('logout').hidden=true;$('retry').hidden=true;msg('生徒用パスワードでログインしてください。')}
function done(r){store.remove(pendingKey());$('heading').textContent='交換完了！';$('confirm').hidden=true;$('retry').hidden=true;$('complete').hidden=false;document.body.classList.add('done');msg('');$('result').textContent=r.rewardName+'\n'+r.usedPoints+'ポイント使いました\n残り '+r.remaining+'ポイント\n\n'+r.when+'\n受付 '+r.receipt.slice(0,8);}
async function quote(){if(busy)return;busy=true;$('retry').hidden=true;msg('確認しています…');try{const r=await rpc('snackQuote',token,rewardId);if(!r.success){if(r.code==='LOGIN')loginView();else{msg(r.message);$('confirm').hidden=true;$('retry').hidden=false}return}ticket=r.ticket;$('login').hidden=true;$('logout').hidden=false;$('confirm').hidden=false;$('student').textContent=r.name+'さん';$('price').textContent=r.points+' pt';$('reward').textContent=r.rewardName;$('balance').textContent='現在の残高：'+r.balance+'ポイント';$('exchange').disabled=r.balance<r.points;msg(r.balance<r.points?'ポイントが足りません。':'このお菓子と交換しますか？')}catch(e){msg(e.message);$('retry').hidden=false}finally{busy=false}}
async function redeem(){if(busy||!ticket)return;busy=true;$('exchange').disabled=true;$('retry').hidden=true;store.set(pendingKey(),ticket);msg('交換を確認しています。画面を閉じずにお待ちください。');try{const r=await rpc('snackRedeem',token,ticket);if(r.success){done(r);return}if(r.code!=='RETRY')store.remove(pendingKey());msg(r.message);if(r.code==='LOGIN')loginView();else $('retry').hidden=false;}catch(e){msg('通信の確認ができませんでした。「交換結果を確認」を押してください。同じ交換で二重に消費されません。');$('retry').hidden=false;}finally{busy=false;if(store.get(pendingKey())){$('retry').textContent='交換結果を確認';$('retry').hidden=false}else $('retry').textContent='確認画面を読み込み直す'}}
$('login').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('loginButton').disabled=true;try{const r=await rpc('snackLogin',$('pass').value,device);$('pass').value='';if(!r.success){msg(r.message);return}token=r.token;store.set('seedSnackToken',token);busy=false;await quote()}catch(e){msg(e.message)}finally{busy=false;$('loginButton').disabled=false}};
$('exchange').onclick=redeem;$('logout').onclick=()=>{store.remove(pendingKey());loginView()};$('retry').onclick=()=>{const p=store.get(pendingKey());if(p){ticket=p;redeem()}else quote()};
token=store.get('seedSnackToken');if(!rewardId){msg('棚に置いてあるQRコードを読み込んでください。')}else if(token){const p=store.get(pendingKey());if(p){ticket=p;redeem()}else quote()}else loginView();
</script></body></html>
