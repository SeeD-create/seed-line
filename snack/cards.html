<!doctype html><html lang="ja"><head><title>お菓子交換QR | 学習塾SeeD</title><meta charset="utf-8"><style>body{font:16px system-ui,sans-serif;background:#f4f7f1;color:#243b2e;margin:30px}h1{font-size:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}.card{background:white;border:2px solid #41684e;border-radius:18px;padding:25px;text-align:center;break-inside:avoid}.points{font-size:42px;font-weight:800;margin:12px}canvas,img{margin:auto}a{font-size:12px;word-break:break-all;color:#346546}button{padding:12px 25px;cursor:pointer}small{display:block;margin:12px} @media print{body{background:white;margin:0}.tools{display:none}.cards{grid-template-columns:repeat(2,1fr)}.card{border-radius:10px}a{display:none}}</style><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script></head><body><div class="tools"><h1>お菓子交換QRコード</h1><p>特典マスタの「有効＝ON」で、必要ポイントが5の倍数の交換枠を表示します。行を追加したら、このページを再読み込みしてください。</p><button onclick="print()">印刷する</button><p>お菓子の棚に貼って使ってください。</p></div><div class="cards"></div><script>
const API='https://script.google.com/macros/s/AKfycbztDdOm_W6RlbxVj-TfG7zxjxhspaTkaGoDvY2qqy8o_enAMRWbtQi9RGNRyndZNLfE/exec';
async function load(){try{const r=await fetch(API+'?action=snack_catalog',{credentials:'omit'});const data=await r.json();if(!data.success)throw Error();for(const item of data.items){const card=document.createElement('section');card.className='card';const brand=document.createElement('b');brand.textContent='学習塾SeeD 🌱';const pt=document.createElement('div');pt.className='points';pt.textContent=item.points+' ポイント';const label=document.createElement('p');label.textContent=item.name;const qr=document.createElement('div');const small=document.createElement('small');small.textContent='スマホで読む → ログイン → 交換する。完了画面を確認して、お菓子を1個どうぞ。';const link=document.createElement('a');link.href=new URL('./?reward='+encodeURIComponent(item.id),location.href).href;link.textContent='交換ページを開く';link.target='_blank';link.rel='noopener';card.append(brand,pt,label,qr,small,link);document.querySelector('.cards').append(card);new QRCode(qr,{text:link.href,width:180,height:180,correctLevel:QRCode.CorrectLevel.M});}}catch(e){document.querySelector('.cards').textContent='一覧を取得できませんでした。再読み込みしてください。';}}load();
</script></body></html>
