<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>タネマキの歩くアニメーション | SeeD</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf9f3;color:#244a38;font-family:system-ui,'Yu Gothic UI',sans-serif;padding:36px 18px}main{max-width:540px;margin:auto}header{font-weight:700;letter-spacing:.06em;margin:0 0 24px}#status{background:#e8f3ed;border-radius:22px;padding:28px;min-height:240px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.label{font-size:13px;color:#60795e}.title{font-size:25px;line-height:1.4;margin:12px 0 6px}.detail{font-size:14px;margin:0;line-height:1.7}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}button{font:inherit;font-size:14px;border:1px solid #c6d3bf;border-radius:24px;background:#fff;color:#244a38;padding:12px 20px;cursor:pointer}button[aria-pressed=true]{background:#315b40;border-color:#315b40;color:white}footer{font-size:12px;text-align:center;color:#778573;margin-top:20px}
/* Picture-book walk, clipped inside the status card. */
#status.has-mascot .status-copy{min-width:0}
.tanemaki-lane{position:relative;overflow:hidden;width:100%;height:86px;margin-top:4px;pointer-events:none}
.tanemaki-walker{position:absolute;bottom:0;width:80px;height:80px;left:-80px}
.tanemaki-sprite{display:block;width:80px;height:80px;background-image:url('https://seed-create.github.io/seed-line/scan/assets/tanemaki-round-pixel-walk-v1.png');image-rendering:pixelated;background-size:200% 200%;background-repeat:no-repeat;animation:tanemaki-frames .64s steps(1,end) infinite}
.tanemaki-lane[data-effect="loading"] .tanemaki-walker{animation:tanemaki-walk 3.8s linear infinite}
.tanemaki-lane[data-effect="welcome"] .tanemaki-walker{animation:tanemaki-run .85s ease-in forwards}
.tanemaki-lane[data-effect="welcome"] .tanemaki-sprite{animation-duration:.32s}
@keyframes tanemaki-frames{0%{background-position:0 0}25%{background-position:100% 0}50%{background-position:0 100%}75%{background-position:100% 100%}}
@keyframes tanemaki-walk{from{left:-80px}to{left:100%}}
@keyframes tanemaki-run{from{left:var(--walk-start,30%)}to{left:100%}}
#status[data-state="camera-wait"]{background:#071b16c9;color:#fff;border-color:#ffffff38;box-shadow:none}
#status[data-state="camera-wait"] .detail{color:#d6e9dd}
@media(prefers-reduced-motion:reduce){.tanemaki-lane *{animation:none!important}.tanemaki-walker{left:calc(50% - 40px)}.tanemaki-lane[data-effect="welcome"] .tanemaki-walker{visibility:hidden}}

</style><main><header>SeeD</header><section id="status" aria-live="polite"></section><div class="controls"><button data-effect="loading" aria-pressed="true">読み込み</button><button data-effect="welcome" aria-pressed="false">入室完了</button><button data-effect="out" aria-pressed="false">退室</button></div><footer>アニメーションの見本です。入退室は記録されません。</footer></main>
<script>
var st=document.getElementById('status');
// Picture-book Tanemaki, four walking frames; decorative, no attendance API.
var tanemakiWalkStarted=0;
function decorateAttendanceStatus(effect){
  st.classList.toggle('has-mascot',!!effect);
  if(!effect){tanemakiWalkStarted=0;return;}
  if(effect==='loading'&&!tanemakiWalkStarted)tanemakiWalkStarted=Date.now();
  st.innerHTML='<div class="status-copy">'+st.innerHTML+'</div><div class="tanemaki-lane" data-effect="'+effect+'" aria-hidden="true"><span class="tanemaki-walker"><span class="tanemaki-sprite"></span></span></div>';
  if(effect==='welcome'){
    var lane=st.querySelector('.tanemaki-lane');
    var phase=tanemakiWalkStarted?((Date.now()-tanemakiWalkStarted)%3800)/3800:.3;
    lane.style.setProperty('--walk-start',(-80+phase*(lane.clientWidth+80))+'px');
    tanemakiWalkStarted=0;
  }
}

function preview(effect){var done=effect==='welcome',out=effect==='out';st.innerHTML='<div class="label">'+(done?'記録しました':out?'退室':'読み取り完了')+'</div><h1 class="title">'+(done?'入室完了':out?'おつかれさまでした':'確認しています')+'</h1><p class="detail">'+(done?'今日も、一歩ずつ。':out?'気をつけて帰ってね。':'そのまま、少し待ってね。')+'</p>';decorateAttendanceStatus(out?'':effect);document.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.effect===effect));});}
document.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){preview(b.dataset.effect);});});preview('loading');
</script></html>
