.tanemaki-shadow{position:absolute;width:56px;height:8px;left:28px;bottom:18px;background:#163c3826;clip-path:polygon(10% 0,90% 0,90% 25%,100% 25%,100% 75%,90% 75%,90% 100%,10% 100%,10% 75%,0 75%,0 25%,10% 25%)}
.tanemaki-dots{position:absolute;bottom:0;left:0;width:100%;display:flex;justify-content:center;gap:7px}.tanemaki-dots i{width:5px;height:5px;background:currentColor;animation:tanemaki-dot 1.2s steps(2,end) infinite}.tanemaki-dots i:nth-child(2){animation-delay:.2s}.tanemaki-dots i:nth-child(3){animation-delay:.4s}
.tanemaki-effect[data-effect="loading"] .tanemaki-sprite{animation:tanemaki-wait 1.25s steps(6,end) infinite}

.tanemaki-spark.s1{left:0;top:30px}.tanemaki-spark.s2{right:0;top:15px;animation-delay:.15s;background:#50a269}.tanemaki-spark.s3{right:4px;bottom:26px;animation-delay:.3s}

@keyframes tanemaki-wait{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}

<body>
<header><div class="brand"><img src="https://seed-create.github.io/seed-line/scan/seed-logo.png" alt=""><strong>学習塾SeeD</strong></div><span>入退室受付</span></header>
<main>
<div class="eyebrow">WELCOME TO SeeD</div>
<div id="setup" hidden>この端末は設定が済んでいません。塾ランチャーの「入退室スキャナ」から開き直してください。</div>
<div class="layout">
<div class="camera">
<div id="reader"></div>
<div class="camera-head"><span><i></i>カメラ映像の全体で読み取れます</span><span>スマホ・カード対応</span></div>
<div class="scan-overlay"><div id="status" data-state="preparing" role="status" aria-live="polite"><div class="label">準備中</div><h1 class="title">カメラを<br>準備しています</h1><p class="detail">まだ、かざさずにお待ちください。</p></div></div>
<div class="camera-controls"><p id="frameMsg">カメラに接続しています</p><button id="startBtn" hidden>カメラを開始</button></div>
</div>
<section class="tools-panel"><div class="help"><strong>「読み取り完了」の合図で、スマホを下ろせます。</strong><br>入退室の記録とLINE通知は、そのあとに続きます。</div>
<form class="manual" id="manual"><label for="code">手入力・USBスキャナ</label><div class="input-row"><input id="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="コードを入力"><button type="submit">読み取る</button></div></form>
<div id="queue" aria-live="polite"></div>
<p class="quiet">読み取り音を有効にするには、画面を一度タップしてください。<br>記録を確認できないときは、受付画面にお知らせします。</p></section>
</div>
</main><footer>学習塾SeeD · 毎日の「来たよ」を、確かに。</footer>
<script>
/* GENERATED_GAS_PRESET */
var EXEC_URL='https://script.google.com/macros/s/AKfycbztDdOm_W6RlbxVj-TfG7zxjxhspaTkaGoDvY2qqy8o_enAMRWbtQi9RGNRyndZNLfE/exec';
var st=document.getElementById('status'),frameMsg=document.getElementById('frameMsg'),codeEl=document.getElementById('code'),startBtn=document.getElementById('startBtn');
var isGas=typeof GAS_PRESET!=='undefined',preset=isGas?GAS_PRESET:(new URLSearchParams(location.search).get('secret')||'');
try{if(preset){localStorage.setItem('attendSecret',preset);if(localStorage.getItem('attendSecret')===preset){if(isGas){google.script.history.replace({}, {page:'checkin'}, '');}else{var clean=new URL(location.href);clean.searchParams.delete('secret');history.replaceState(null,'',clean.pathname+clean.search+clean.hash);}}}}catch(e){}
function getSecret(){if(preset)return preset;try{return localStorage.getItem('attendSecret')||'';}catch(e){return '';}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var actx=null;
function unlockAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume().catch(function(){});}catch(e){}}
document.addEventListener('click',unlockAudio);document.addEventListener('keydown',unlockAudio);
function tone(hz,ms){try{if(!actx||actx.state!=='running')return;var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=hz;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.16,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+ms/1000);o.start();o.stop(actx.currentTime+ms/1000);}catch(e){}}
var tick='<span class="check"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>読み取りました</span>';
var resultTimer=null,resultDisplayVersion=0;
function clearResultTimer(){resultDisplayVersion++;if(resultTimer!==null){clearTimeout(resultTimer);resultTimer=null;}}
function dismissResultAfterDelay(){var version=resultDisplayVersion,receiptId=currentId;resultTimer=setTimeout(function(){if(version!==resultDisplayVersion||currentId!==receiptId)return;resultTimer=null;currentId=null;ready();},2000);}
// An original code-native pixel sprite based on SeeD's white, single-leaf mascot.
function tanemakiPixelMarkup(effect){
  var sprite='<svg class="tanemaki-sprite" viewBox="0 0 32 36" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" focusable="false">'+
    '<g class="tanemaki-leaf"><path fill="#354432" d="M17 13V8h2V6h2V4h3V2h5v5h-1v3h-2v2h-4v2z"/>'+
    '<path fill="#65b74e" d="M19 11V8h2V6h3V4h3v3h-1v2h-3v2z"/><path fill="#a2d46c" d="M21 7V6h3V4h3v1h-3v2z"/><path fill="#3e8a46" d="M18 12h2v-2h2V8h2V6h2v1h-1v2h-2v2h-3v2h-2z"/></g>'+
    '<path fill="#3e332b" d="M8 31h6v3h-2v1H7v-2h1zm13 0h5v2h2v2h-6v-1h-1z"/><path fill="#fffdf5" d="M9 32h3v1h-1v1H8v-1h1zm14 0h2v1h1v1h-3z"/>'+
    '<path fill="#3e332b" d="M9 12h13v1h3v2h2v3h1v3h-1v7h-2v3h-3v2H9v-1H6v-3H4V18h1v-3h2v-2h2z"/>'+
    '<path fill="#fffdf5" d="M10 13h11v1h3v2h2v5h-1v7h-2v3h-3v1H10v-1H7v-3H5V19h1v-3h2v-2h2z"/>'+
    '<path fill="#e6ede3" d="M5 24h1v4h2v2h3v1h9v-1h3v-2h2v-4h1v5h-2v2h-3v1H9v-1H7v-2H5z"/>'+
    '<path fill="#3e332b" d="M5 22H3v1H2v2H1v3h3v-1h2v-3h1v-2zm21-4h2v-2h2v-1h2v5h-2v2h-4z"/>'+
    '<path fill="#fffdf5" d="M5 23H4v1H3v2H2v1h1v-1h2v-2h1v-1zm21-3h2v-2h2v-1h1v2h-2v2h-3z"/>'+
    '<path fill="#3e332b" d="M11 20h2v2h-2zm9 0h2v2h-2zM13 24h2v1h4v-1h2v2h-2v1h-4v-1h-2z"/>'+ 
    '<path fill="#efc8ab" d="M9 23h2v1H9zm13 0h2v1h-2z"/></svg>';
  return '<div class="tanemaki-effect" data-effect="'+effect+'" aria-hidden="true"><span class="tanemaki-shadow"></span>'+sprite+
    (effect==='loading'?'<span class="tanemaki-dots"><i></i><i></i><i></i></span>':'<span class="tanemaki-spark s1"></span><span class="tanemaki-spark s2"></span><span class="tanemaki-spark s3"></span>')+'</div>';
}
function decorateAttendanceStatus(effect){
  st.classList.toggle('has-mascot',!!effect);
  if(effect)st.innerHTML='<div class="status-copy">'+st.innerHTML+'</div>'+tanemakiPixelMarkup(effect);
}

function state(kind,label,title,detail){clearResultTimer();st.dataset.state=kind;st.innerHTML='<div class="label">'+label+'</div><h1 class="title">'+title+'</h1><p class="detail">'+detail+'</p>';decorateAttendanceStatus(kind==='preparing'||kind==='read'?'loading':'');}
function ready(){state('ready','受付中','QRをかざしてください','読み取れたら、すぐにお知らせします。');}
var entries=[],currentId=null,sending=false,seen=Object.create(null),_i=0;
try{entries=JSON.parse(sessionStorage.getItem('seedAttendanceOutbox')||'[]').filter(function(x){return x&&typeof x.code==='string'&&/^[\w-]{16,80}$/.test(x.id);}).map(function(x){return{id:x.id,code:x.code,state:'uncertain'};});}catch(e){entries=[];}
function save(){try{sessionStorage.setItem('seedAttendanceOutbox',JSON.stringify(entries.filter(function(x){return x.state!=='done';}).map(function(x){return {id:x.id,code:x.code};})));}catch(e){}}
function receipts(){var list=entries.slice(-8);var outstanding=entries.filter(function(x){return x.state!=='done';});list=outstanding.concat(list.filter(function(x){return x.state==='done';}));document.getElementById('queue').innerHTML=list.length?'<div class="queue-title">受付の記録</div>'+list.map(function(x){var r=x.result;var title=r&&r.name?esc(r.name)+' さん · '+esc(r.type||'')+(r.cooldown?'済み':''):('読み取り '+esc(x.number||''));var msg=x.state==='done'?'記録済み':x.state==='uncertain'?'受付で再確認':x.state==='error'?'受付で再確認':'読み取り済み · 記録を確認しています';return '<div class="receipt '+''+'"><div>'+title+'<small>'+msg+'</small></div>'+((x.state==='uncertain'||x.state==='error')?'<button data-retry="'+esc(x.id)+'">再確認</button>':'')+'</div>';}).join(''):'';}
document.getElementById('queue').addEventListener('click',function(e){var id=e.target.getAttribute('data-retry');if(!id)return;var x=entries.find(function(x){return x.id===id;});if(x){clearResultTimer();x.state='queued';currentId=x.id;save();receipts();state('read',tick,'記録を確認しています','もう一度QRをかざす必要はありません。');pump();}});
function transport(x,cb){var finished=false,timer;function finish(r){if(finished)return;finished=true;clearTimeout(timer);cb(r);}
 timer=setTimeout(function(){finish({uncertain:true,message:'通信の確認が必要です'});},20000);
 if(isGas){google.script.run.withSuccessHandler(finish).withFailureHandler(function(){finish({uncertain:true});}).apiCheckin(getSecret(),x.code,x.id);return;}
 var name='__seedAttendance'+(++_i),s=document.createElement('script');function cleanup(){if(s.parentNode)s.parentNode.removeChild(s);window[name]=function(){};setTimeout(function(){delete window[name];},60000);}
 window[name]=function(r){cleanup();finish(r);};s.onerror=function(){cleanup();finish({uncertain:true});};s.referrerPolicy='no-referrer';s.src=EXEC_URL+'?'+new URLSearchParams({action:'checkin',code:x.code,secret:getSecret(),requestId:x.id,callback:name});document.body.appendChild(s);
 setTimeout(cleanup,21000);
}
function showResult(x){clearResultTimer();var r=x.result;if(x.state!=='done'){currentId=null;ready();return;}var kind=r.type==='退室'?'out':'in';st.dataset.state=kind;st.innerHTML='<div class="label">'+(r.cooldown?'すでに記録済みです':'記録しました')+'</div><div class="name">'+esc(r.name)+'<small>さん</small></div><div class="action">'+esc(r.type)+(r.cooldown?'済み':'完了')+'</div><p class="detail">'+(r.type==='退室'?'おつかれさまでした。':'今日も、一歩ずつ。')+'</p>';decorateAttendanceStatus(r.type==='入室'&&!r.cooldown?'welcome':'');dismissResultAfterDelay();}
function pump(){if(sending)return;var x=entries.find(function(x){return x.state==='queued';});if(!x)return;sending=true;x.state='sending';save();receipts();transport(x,function(r){sending=false;if(r&&(r.ok||r.cooldown)){x.state='done';x.result=r;delete x.code;tone(880,90);}else{x.state=r&&r.uncertain?'uncertain':'error';x.message=r&&r.message||'通信の確認が必要です';}save();receipts();if(currentId===x.id)showResult(x);pump();});}
function submit(code){code=String(code||'').trim();if(!code)return;if(!getSecret()){document.getElementById('setup').hidden=false;state('error','端末の設定','ランチャーから<br>開き直してください','受付の設定を確認してください。');return;}
 var key=code.toLowerCase(),pending=entries.find(function(x){return x.code&&x.code.toLowerCase()===key&&x.state!=='done';});if(pending){currentId=pending.id;if(pending.state==='uncertain'||pending.state==='error'){pending.state='queued';save();receipts();tone(660,40);state('read',tick,'読み取り完了 ✓','同じ受付の記録を確認しています。もう、かざす必要はありません。');pump();}else state('read',tick,'読み取り完了 ✓','読み取り済みです。そのまま記録を続けています。');return;}
 var recent=entries.find(function(x){return x.key===key&&x.state==='done'&&Date.now()-x.at<60000;});if(recent){currentId=recent.id;showResult({state:'done',result:Object.assign({},recent.result,{cooldown:true})});return;}
 var id=crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Array.from(crypto.getRandomValues(new Uint32Array(4))).map(function(n){return n.toString(36);}).join('-');var x={id:id,code:code,key:key,at:Date.now(),number:entries.length+1,state:'queued'};entries.push(x);currentId=id;save();tone(660,40);state('read',tick,'読み取り完了 ✓','入退室を記録しています。もう、かざす必要はありません。');receipts();pump();}
function onDecoded(text){var code=String(text||'').trim();if(!code)return;var key=code.toLowerCase(),now=Date.now(),lastSeen=seen[key];seen[key]=now;if(lastSeen&&now-lastSeen<1800)return;submit(code);}
document.getElementById('manual').addEventListener('submit',function(e){e.preventDefault();unlockAudio();var c=codeEl.value;codeEl.value='';submit(c);});
var qr=null,starting=false,camStarted=false,camAttempt=0;
function tuneTrack(){try{var v=document.querySelector('#reader video');if(v){var fit=function(){if(v.videoWidth&&v.videoHeight)document.getElementById('reader').style.setProperty('--video-aspect',String(v.videoWidth/v.videoHeight));};v.addEventListener('resize',fit);fit();}var t=v&&v.srcObject&&v.srcObject.getVideoTracks()[0];if(t&&t.applyConstraints)t.applyConstraints({width:{ideal:1920},height:{ideal:1080},advanced:[{focusMode:'continuous'}]}).catch(function(){t.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(function(){});});}catch(e){}}
function camError(){frameMsg.textContent='手入力・USBスキャナも使えます';if(!currentId)state('camera-wait','カメラの準備','カメラを開始してください','下のボタンから開始できます。');startBtn.hidden=false;startBtn.textContent=starting?'ページを開き直す':'カメラを開始';}
function startCamera(){unlockAudio();if(starting){location.reload();return;}if(camStarted)return;starting=true;startBtn.hidden=true;var attempt=++camAttempt;frameMsg.textContent='カメラに接続しています';if(!currentId)state('preparing','準備中','カメラを準備しています','まだ、かざさずにお待ちください。');var watchdog=setTimeout(function(){if(attempt===camAttempt&&starting)camError();},6000);
 try{if(!qr)qr=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],verbose:false});var cfg={fps:30,disableFlip:true,experimentalFeatures:{useBarCodeDetectorIfSupported:true}};
 var devices=Html5Qrcode.getCameras().catch(function(){return [];});devices.then(function(d){return qr.start(d&&d.length?d[d.length-1].id:{facingMode:'environment'},cfg,onDecoded,function(){});}).then(function(){clearTimeout(watchdog);starting=false;camStarted=true;startBtn.hidden=true;frameMsg.textContent='カメラにQRをかざしてください';if(!currentId)ready();tuneTrack();}).catch(function(){clearTimeout(watchdog);starting=false;camError();});
 }catch(e){clearTimeout(watchdog);starting=false;camError();}}
startBtn.addEventListener('click',startCamera);receipts();
window.addEventListener('beforeunload',function(e){if(entries.some(function(x){return x.state!=='done';})){e.preventDefault();e.returnValue='';}});
if(getSecret())startCamera();else{document.getElementById('setup').hidden=false;frameMsg.textContent='端末の設定を確認してください';state('error','端末の設定','ランチャーから<br>開き直してください','設定すると、次回からそのまま使えます。');}
</script>
</body></html>
