<body>

<header><div class="brand"><img src="https://seed-create.github.io/seed-line/scan/seed-logo.png" alt=""><strong>学習塾SeeD</strong></div><span>入退室受付</span></header>

<main>

<div class="eyebrow">WELCOME TO SeeD</div>

<div id="setup" hidden><strong>この端末の初回設定</strong><form id="setupForm"><label for="setupKey">教室用の受付キー</label><div class="input-row"><input id="setupKey" type="password" autocomplete="off" required><button id="setupSave" type="submit">設定する</button></div></form><p id="setupMessage" role="alert"></p></div>

<div class="layout">

<div class="camera">

<div id="reader"></div>

<div class="camera-head"><span><i></i>カメラ映像の全体で読み取れます</span><span>スマホ・カード対応</span></div>

<div class="scan-overlay"><div id="status" data-state="preparing" role="status" aria-live="polite"><div class="label">準備中</div><h1 class="title">カメラを<br>準備しています</h1><p class="detail">まだ、かざさずにお待ちください。</p></div></div>

<div class="camera-controls"><p id="frameMsg">カメラに接続しています</p><button id="startBtn" hidden>カメラを開始</button></div>

</div>

<section class="tools-panel"><p id="attendanceHealth" role="status" aria-live="polite"></p><div class="help"><strong>「読み取り完了」の合図で、スマホを下ろせます。</strong><br>入退室の記録とLINE通知は、そのあとに続きます。</div>

<form class="manual" id="manual"><label for="code">手入力・USBスキャナ</label><div class="input-row"><input id="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="コードを入力"><button type="submit">読み取る</button></div></form>

<div id="queue" aria-live="polite"></div>

<p class="quiet">読み取り音を有効にするには、画面を一度タップしてください。<br>記録を確認できないときは、受付画面にお知らせします。</p></section>

</div>

</main><footer>学習塾SeeD · 毎日の「来たよ」を、確かに。</footer>

<script>

/* GENERATED_GAS_PRESET */

var EXEC_URL='https://script.google.com/macros/s/AKfycbztDdOm_W6RlbxVj-TfG7zxjxhspaTkaGoDvY2qqy8o_enAMRWbtQi9RGNRyndZNLfE/exec';

var st=document.getElementById('status'),frameMsg=document.getElementById('frameMsg'),codeEl=document.getElementById('code'),startBtn=document.getElementById('startBtn');

var isGas=typeof GAS_PRESET!=='undefined',preset=isGas?GAS_PRESET:(new URLSearchParams(location.search).get('secret')||'');

try{if(preset){localStorage.setItem('attendSecret',preset);if(localStorage.getItem('attendSecret')===preset){if(isGas){google.script.history.replace({}, {page:'checkin'}, '');}else{var clean=new URL(location.href);clean.searchParams.delete('secret');history.replaceState(null,'',clean.pathname+clean.search+clean.hash);}}}}catch(e){}

function getSecret(){if(preset)return preset;try{return localStorage.getItem('attendSecret')||'';}catch(e){return '';}}

// No credentials or scan data are placed in the iframe URL or persisted here.
function seedCreateAttendanceRpc(execUrl) {
 if(location.origin!=='https://seed-create.github.io')return null;
 var frame=null,peer=null,peerOrigin='',channel='',startupTimer=null,pending=Object.create(null);
 function id(){return crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint32Array(8))).map(function(n){return n.toString(36);}).join('-');}
 function closeFrame(){if(startupTimer)clearTimeout(startupTimer);startupTimer=null;if(frame)frame.remove();frame=null;peer=null;peerOrigin='';}
 function start(){
  if(frame)return;
  channel=id();frame=document.createElement('iframe');frame.hidden=true;frame.setAttribute('aria-hidden','true');frame.title='SeeD scanner transport';frame.referrerPolicy='no-referrer';
  // Modern browsers can load this public transport without Google login cookies.
  frame.setAttribute('credentialless','');
  frame.src=execUrl+'?'+new URLSearchParams({page:'attendance-bridge',origin:location.origin,channel:channel});
  document.body.appendChild(frame);
  startupTimer=setTimeout(function(){if(!peer)closeFrame();},30000);
 }
 function fromOwnedFrame(source){
  try{for(var i=0;i<6&&source;i++){if(source===frame.contentWindow)return true;var next=source.parent;if(next===source)break;source=next;}}catch(ignore){}
  return false;
 }
 function trustedOrigin(origin){return /^https:\/\/([a-z0-9-]+\.)?googleusercontent\.com$/.test(origin);}
 window.addEventListener('message',function(event){
  var d=event.data;
  if(!frame||!d||d.v!==1||d.channel!==channel||!trustedOrigin(event.origin)||!fromOwnedFrame(event.source))return;
  if(d.type==='seed-attendance-ready'){
   if(peer&&peer!==event.source)return;
   peer=event.source;peerOrigin=event.origin;if(startupTimer)clearTimeout(startupTimer);startupTimer=null;return;
  }
  if(d.type!=='seed-attendance-result'||event.source!==peer||event.origin!==peerOrigin)return;
  var request=pending[d.id];if(!request)return;delete pending[d.id];
  if(d.transportError||!d.result||typeof d.result.ok!=='boolean'){
   peer=null;request.failure();if(!Object.keys(pending).length){closeFrame();start();}
  }else request.success(d.result);
 });
 start();
 return {
  ready:function(){return !!peer;},
  call:function(operation,args,success,failure){
   if(!peer){if(!frame)start();return null;}
   var requestId=id(),message={type:'seed-attendance-call',v:1,channel:channel,id:requestId,operation:operation};
   Object.keys(args||{}).forEach(function(k){if(['secret','code','requestId','scannedAt'].indexOf(k)>=0)message[k]=args[k];});
   pending[requestId]={success:success,failure:failure};
   try{peer.postMessage(message,peerOrigin);}catch(ignore){delete pending[requestId];peer=null;return null;}
   return function(){delete pending[requestId];};
  }
 };
}

var attendanceRpc=isGas?null:seedCreateAttendanceRpc(EXEC_URL);


function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

var actx=null;

function unlockAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume().catch(function(){});}catch(e){}}

document.addEventListener('click',unlockAudio);document.addEventListener('keydown',unlockAudio);

function tone(hz,ms){try{if(!actx||actx.state!=='running')return;var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=hz;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.16,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+ms/1000);o.start();o.stop(actx.currentTime+ms/1000);}catch(e){}}

var tick='<span class="check"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>読み取りました</span>';

var resultTimer=null,resultDisplayVersion=0;

function clearResultTimer(){resultDisplayVersion++;if(resultTimer!==null){clearTimeout(resultTimer);resultTimer=null;}}

function dismissResultAfterDelay(delayMs){var version=resultDisplayVersion,receiptId=currentId;resultTimer=setTimeout(function(){if(version!==resultDisplayVersion||currentId!==receiptId)return;resultTimer=null;currentId=null;ready();},delayMs||2000);}

// Picture-book Tanemaki, four walking frames; decorative, no attendance API.

var tanemakiWalkStarted=0;

function decorateAttendanceStatus(effect){

  st.classList.toggle('has-mascot',!!effect);

  if(!effect){tanemakiWalkStarted=0;return;}

  if(effect==='loading'&&!tanemakiWalkStarted)tanemakiWalkStarted=Date.now();

  st.innerHTML='<div class="status-copy">'+st.innerHTML+'</div><div class="tanemaki-lane" data-effect="'+effect+'" aria-hidden="true"><span class="tanemaki-walker"><span class="tanemaki-sprite"></span></span></div>';

  if(effect==='welcome'){

    var lane=st.querySelector('.tanemaki-lane');

    var phase=tanemakiWalkStarted?((Date.now()-tanemakiWalkStarted)%3800)/3800:.3;

    lane.style.setProperty('--walk-start',Math.max(0,Math.min(lane.clientWidth-80,(-80+phase*(lane.clientWidth+80))))+'px');

    tanemakiWalkStarted=0;

  }

}

function state(kind,label,title,detail){clearResultTimer();st.dataset.state=kind;st.innerHTML='<div class="label">'+label+'</div><h1 class="title">'+title+'</h1><p class="detail">'+detail+'</p>';decorateAttendanceStatus(kind==='preparing'||kind==='read'?'loading':'');}

function ready(){state('ready','受付中','QRをかざしてください','読み取れたら、すぐにお知らせします。');}

var entries=[],currentId=null,sending=false,seen=Object.create(null),_i=0;

var OUTBOX_PREFIX='seedAttendancePendingV2:',storageWarning=false;
function pendingRecord(x){return x&&typeof x.code==='string'&&x.code.length<=80&&/^[\w-]{16,80}$/.test(x.id);}
function loadPending(){
 var found=Object.create(null);
 function add(x){if(pendingRecord(x))found[x.id]={id:x.id,code:x.code,at:Number(x.at)||0,state:'uncertain',message:'前回の読み取りです。「再確認」で記録を確認できます。'};}
 try{JSON.parse(sessionStorage.getItem('seedAttendanceOutbox')||'[]').forEach(add);}catch(e){}
 try{for(var n=0;n<localStorage.length;n++){var key=localStorage.key(n);if(key&&key.indexOf(OUTBOX_PREFIX)===0){try{add(JSON.parse(localStorage.getItem(key)));}catch(e){}}}}catch(e){}
 return Object.keys(found).map(function(id){return found[id];});
}
entries=loadPending();
function save(){
 var pending=entries.filter(function(x){return x.state!=='done'&&x.state!=='expired';});
 storageWarning=false;
 entries.forEach(function(x){try{var key=OUTBOX_PREFIX+x.id;if(x.state==='done'||x.state==='expired')localStorage.removeItem(key);else localStorage.setItem(key,JSON.stringify({id:x.id,code:x.code,at:Number(x.at)||0}));}catch(e){storageWarning=true;}});
 try{sessionStorage.setItem('seedAttendanceOutbox',JSON.stringify(pending.map(function(x){return{id:x.id,code:x.code,at:Number(x.at)||0};})));}catch(e){storageWarning=true;}
}

function receipts(){var list=entries.slice(-8);var outstanding=entries.filter(function(x){return x.state!=='done'&&x.state!=='expired';});list=outstanding.concat(list.filter(function(x){return x.state==='done'||x.state==='expired';}));document.getElementById('queue').innerHTML=(storageWarning?'<p role="alert" class="storage-warning">この端末では未確認の記録を保存できません。この画面を閉じずに完了を確認してください。</p>':'')+(list.length?'<div class="queue-title">受付の記録</div>'+list.map(function(x){var r=x.result;var title=r&&r.name?esc(r.name)+' さん · '+esc(r.type||'')+(r.cooldown?'済み':''):('読み取り '+esc(x.number||''));var msg=x.state==='done'?'記録済み':x.state==='expired'?x.message:x.state==='uncertain'?(x.message||'通信の応答がありません'):x.state==='error'?(x.message||'記録できませんでした'):'読み取り済み · 記録を確認しています';return '<div class="receipt '+((x.state==='error'||x.state==='uncertain')?'error':'')+'"><div>'+title+'<small>'+esc(msg)+'</small></div>'+((x.state==='uncertain'||x.state==='error')?'<button data-retry="'+esc(x.id)+'">再確認</button>':'')+'</div>';}).join(''):'');}

document.getElementById('queue').addEventListener('click',function(e){var id=e.target.getAttribute('data-retry');if(!id)return;var x=entries.find(function(x){return x.id===id;});if(x){clearResultTimer();x.state='queued';currentId=x.id;save();receipts();state('read',tick,'記録を確認しています','もう一度QRをかざす必要はありません。');pump();}});

function transport(x,cb){
 var finished=false,cancelRpc=null,controller=typeof AbortController==='function'?new AbortController():null;
 var timer=setTimeout(function(){finish({uncertain:true,message:'通信の応答がありません。同じ読み取りを再確認してください。'});if(controller)controller.abort();},25000);
 function finish(r){if(finished)return;finished=true;clearTimeout(timer);if(cancelRpc)cancelRpc();cb(r);}
 try{
  if(isGas){google.script.run.withSuccessHandler(finish).withFailureHandler(function(){finish({uncertain:true,message:'サーバーの応答を確認できません。同じ読み取りを再確認してください。'});}).apiCheckin(getSecret(),x.code,x.id,Number(x.at)||0);return;}
  // Omit Google login cookies: multi-account redirects can otherwise return a
  // Google Drive error page instead of the public Apps Script response.
  function fetchReceipt(){
   if(finished)return;
  var callback='seedReceipt';
  var url=EXEC_URL+'?'+new URLSearchParams({action:'checkin',code:x.code,secret:getSecret(),requestId:x.id,scannedAt:String(Number(x.at)||0),callback:callback});
  var options={method:'GET',credentials:'omit',redirect:'follow',referrerPolicy:'no-referrer'};
  if(controller)options.signal=controller.signal;
  fetch(url,options).then(function(response){if(!response.ok)throw new Error('HTTP '+response.status);return response.text();}).then(function(text){
   text=text.trim();var prefix=callback+'(';
   if(text.slice(0,prefix.length)!==prefix||text.slice(-2)!==');')throw new Error('Unexpected response');
   finish(JSON.parse(text.slice(prefix.length,-2)));
  }).catch(function(){finish({uncertain:true,message:'通信を確認できません。同じ読み取りを再確認してください。'});});
  }
  if(attendanceRpc)cancelRpc=attendanceRpc.call('scan',{secret:getSecret(),code:x.code,requestId:x.id,scannedAt:Number(x.at)||0},finish,fetchReceipt);
  if(!cancelRpc)fetchReceipt();
 }catch(err){finish({uncertain:true,message:'通信を開始できません。同じ読み取りを再確認してください。'});}
}

function showResult(x){clearResultTimer();var r=x.result;if(x.state!=='done'){
  currentId=null;
  state('error','記録の確認が必要です','入退室を確認できませんでした',esc(x.message||'通信の応答がありません。同じ受付を再確認してください。'));
  // Close only the large status card. The durable receipt and its retry button stay below.
  dismissResultAfterDelay(5000);
  if(x.state==='expired')return;var retry=document.createElement('button');retry.type='button';retry.className='retry-current';retry.textContent='この読み取りを再確認';
  retry.addEventListener('click',function(){x.state='queued';currentId=x.id;save();receipts();state('read',tick,'記録を再確認しています','もう一度QRをかざす必要はありません。');pump();});st.appendChild(retry);tone(220,150);return;
 }var kind=r.type==='退室'?'out':'in';st.dataset.state=kind;st.innerHTML='<div class="label">'+(r.cooldown?'すでに記録済みです':'記録しました')+'</div><div class="name">'+esc(r.name)+'<small>さん</small></div><div class="action">'+esc(r.type)+(r.cooldown?'済み':'完了')+'</div><p class="detail">'+(r.type==='退室'?'おつかれさまでした。':'今日も、一歩ずつ。')+'</p>';decorateAttendanceStatus(!r.cooldown?(r.type==='入室'?'welcome':'farewell'):'');dismissResultAfterDelay();}

function pump(){if(sending)return;var x=entries.find(function(x){return x.state==='queued';});if(!x)return;sending=true;x.state='sending';save();receipts();transport(x,function(r){sending=false;if(r&&(r.ok||r.cooldown)){x.state='done';x.result=r;delete x.code;tone(880,90);}else{x.state=r&&r.expired?'expired':r&&r.uncertain?'uncertain':'error';if(x.state==='expired')delete x.code;x.message=r&&r.message||'通信の確認が必要です';}if(r&&r.message==='認証エラー')document.getElementById('setup').hidden=false;save();receipts();if(x.state!=='done'||currentId===x.id)showResult(x);pump();});}

function submit(code){code=String(code||'').trim();if(!code)return;if(code.length>80){state('error','QRの確認','生徒用QRをかざしてください','このQRは入退室用ではありません。');return;}if(!getSecret()){document.getElementById('setup').hidden=false;state('error','端末の設定','受付キーを設定してください','受付の設定を確認してください。');return;}

 var key=code.toLowerCase(),pending=entries.find(function(x){return x.code&&x.code.toLowerCase()===key&&x.state!=='done'&&x.state!=='expired';});if(pending){currentId=pending.id;if(pending.state==='uncertain'||pending.state==='error'){pending.state='queued';save();receipts();tone(660,40);state('read',tick,'読み取り完了 ✓','同じ受付の記録を確認しています。もう、かざす必要はありません。');pump();}else state('read',tick,'読み取り完了 ✓','読み取り済みです。そのまま記録を続けています。');return;}

 var recent=entries.find(function(x){return x.key===key&&x.state==='done'&&Date.now()-x.at<60000;});if(recent){currentId=recent.id;showResult({state:'done',result:Object.assign({},recent.result,{cooldown:true})});return;}

 var id=crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Array.from(crypto.getRandomValues(new Uint32Array(4))).map(function(n){return n.toString(36);}).join('-');var x={id:id,code:code,key:key,at:Date.now(),number:entries.length+1,state:'queued'};entries.push(x);currentId=id;save();tone(660,40);state('read',tick,'読み取り完了 ✓','入退室を記録しています。もう、かざす必要はありません。');receipts();pump();}

function onDecoded(text){var code=String(text||'').trim();if(!code)return;var key=code.toLowerCase(),now=Date.now(),lastSeen=seen[key];seen[key]=now;if(lastSeen&&now-lastSeen<1800)return;submit(code);}

document.getElementById('manual').addEventListener('submit',function(e){e.preventDefault();unlockAudio();var c=codeEl.value;codeEl.value='';submit(c);});

var qr=null,starting=false,camStarted=false,camAttempt=0,desiredFacing='user';
try{desiredFacing=localStorage.getItem('attendFacing')==='environment'?'environment':'user';}catch(e){}
var switchBtn=document.createElement('button');switchBtn.id='switchCamera';switchBtn.type='button';
startBtn.parentElement.appendChild(switchBtn);
function cameraLabel(){switchBtn.textContent=desiredFacing==='user'?'外側カメラに切替':'内側カメラに切替';switchBtn.disabled=starting;}
cameraLabel();
function tuneTrack(){try{var v=document.querySelector('#reader video');if(v){var fit=function(){if(v.videoWidth&&v.videoHeight)document.getElementById('reader').style.setProperty('--video-aspect',String(v.videoWidth/v.videoHeight));};v.addEventListener('resize',fit);fit();}}catch(e){}}
function camError(err){
 var denied=err&&/NotAllowed|Permission|denied/i.test(String(err.name||'')+' '+String(err.message||err));
 frameMsg.textContent=denied?'ブラウザのカメラ許可を確認してください':'手入力・USBスキャナも使えます';
 if(!currentId)state('camera-wait','カメラの準備',denied?'カメラを許可してください':'カメラを開始してください',denied?'SafariまたはChromeで開き、サイトのカメラ使用を許可してください。':'下のボタンから開始できます。');
 startBtn.hidden=false;startBtn.textContent=starting?'ページを開き直す':'カメラを開始';cameraLabel();
}
function startCamera(){
 unlockAudio();if(starting){location.reload();return;}if(camStarted)return;
 if(!getSecret()){state('error','端末の設定','受付キーを設定してください','教室用の初回設定リンクから開いてください。');return;}
 starting=true;cameraLabel();startBtn.hidden=true;var attempt=++camAttempt;
 frameMsg.textContent=(desiredFacing==='user'?'内側':'外側')+'カメラに接続しています';
 if(!currentId)state('preparing','準備中','カメラを準備しています','まだ、かざさずにお待ちください。');
 var watchdog=setTimeout(function(){if(attempt===camAttempt&&starting)camError();},12000);
 try{
  if(!qr)qr=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],verbose:false});
  var cfg={fps:12,disableFlip:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}};
  qr.start({facingMode:{exact:desiredFacing}},cfg,onDecoded,function(){}).catch(function(err){
   if(!/Overconstrained|ConstraintNotSatisfied|NotFound/i.test(String(err&&err.name||'')+' '+String(err&&err.message||err)))throw err;
   return Html5Qrcode.getCameras().then(function(devices){
    var pattern=desiredFacing==='user'?/front|user|前面|内側|フロント|facetime/i:/back|rear|environment|背面|外側/i;
    var match=devices.find(function(d){return pattern.test(d.label||'');});
    if(!match&&devices.length===1)match=devices[0];
    if(!match)throw new Error('指定したカメラが見つかりません。カメラ切替をお試しください。');
    return qr.start(match.id,cfg,onDecoded,function(){});
   });
  }).then(function(){
   if(attempt!==camAttempt)return;clearTimeout(watchdog);starting=false;camStarted=true;cameraLabel();startBtn.hidden=true;
   frameMsg.textContent=(desiredFacing==='user'?'内側':'外側')+'カメラにQRをかざしてください';if(!currentId)ready();tuneTrack();watchAttendanceCamera();
  }).catch(function(err){if(attempt!==camAttempt)return;clearTimeout(watchdog);starting=false;cameraLabel();camError(err);});
 }catch(err){clearTimeout(watchdog);starting=false;cameraLabel();camError(err);}
}
switchBtn.addEventListener('click',function(){
 if(starting)return;
 desiredFacing=desiredFacing==='user'?'environment':'user';
 try{localStorage.setItem('attendFacing',desiredFacing);}catch(e){}
 cameraLabel();
 if(!camStarted){startCamera();return;}
 starting=true;cameraLabel();
 qr.stop().then(function(){camStarted=false;starting=false;cameraLabel();startCamera();}).catch(function(err){starting=false;cameraLabel();camError(err);});
});

function watchAttendanceCamera(){
 var video=document.querySelector('#reader video'),track=video&&video.srcObject&&video.srcObject.getVideoTracks()[0];
 if(!track)return;
 track.addEventListener('ended',function(){
  if(!camStarted)return;camStarted=false;frameMsg.textContent='カメラが停止しました';startBtn.hidden=false;startBtn.textContent='カメラを再開';
  if(!currentId)state('camera-wait','カメラの確認','カメラを再開してください','記録途中の読み取りは保持しています。');
 });
}
function resumeAttendanceCamera(){
 if(document.visibilityState==='hidden'||starting)return;
 var video=document.querySelector('#reader video'),track=video&&video.srcObject&&video.srcObject.getVideoTracks()[0];
 if(camStarted&&track&&track.readyState==='live')return;
 if(!getSecret())return;
 if(qr){starting=true;cameraLabel();var old=qr;Promise.resolve().then(function(){return old.stop();}).catch(function(){}).then(function(){qr=null;camStarted=false;starting=false;cameraLabel();startCamera();});}
 else startCamera();
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&getSecret())resumeAttendanceCamera();});
window.addEventListener('pageshow',function(event){if(event.persisted&&getSecret())resumeAttendanceCamera();});

var setupForm=document.getElementById('setupForm'),setupMessage=document.getElementById('setupMessage');
function verifySetupKey(key){
 return new Promise(function(resolve,reject){
  var cancelStatus=null,timeout=setTimeout(function(){if(cancelStatus)cancelStatus();reject(new Error('通信の応答がありません。時間をおいて設定してください。'));},25000);
  function done(value){clearTimeout(timeout);if(cancelStatus)cancelStatus();resolve(value);}function bad(){clearTimeout(timeout);if(cancelStatus)cancelStatus();reject(new Error('接続できません。インターネット接続を確認してください。'));}
  if(isGas){try{google.script.run.withSuccessHandler(done).withFailureHandler(bad).apiAttendanceStatus(key);}catch(e){bad();}return;}
  function fetchStatus(){
  fetch(EXEC_URL+'?'+new URLSearchParams({action:'checkin',operation:'queueStatus',secret:key,callback:'seedSetup'}),{credentials:'omit',referrerPolicy:'no-referrer'}).then(function(r){if(!r.ok)throw new Error();return r.text();}).then(function(text){text=text.trim();if(text.slice(0,10)!=='seedSetup('||text.slice(-2)!==');')throw new Error();done(JSON.parse(text.slice(10,-2)));}).catch(bad);
  }
  if(attendanceRpc)cancelStatus=attendanceRpc.call('status',{secret:key},done,fetchStatus);
  if(!cancelStatus)fetchStatus();
 });
}
setupForm.addEventListener('submit',function(event){
 event.preventDefault();var input=document.getElementById('setupKey'),button=document.getElementById('setupSave'),key=input.value.trim();if(!key)return;
 button.disabled=true;setupMessage.textContent='受付キーを確認しています。';
 verifySetupKey(key).then(function(result){
  if(!result||!result.ok)throw new Error('受付キーが確認できません。教室用のキーを入力してください。');
  if(!result.queueReady)throw new Error('受付の更新準備中です。管理者にお知らせください。');
  preset=key;var stored=false;try{localStorage.setItem('attendSecret',key);stored=localStorage.getItem('attendSecret')===key;}catch(e){}
  input.value='';document.getElementById('setup').hidden=true;setupMessage.textContent='';
  if(!stored){storageWarning=true;receipts();}
  if(!camStarted)startCamera();else ready();
 }).catch(function(error){setupMessage.textContent=error.message;}).finally(function(){button.disabled=false;});
});

var healthElement=document.getElementById('attendanceHealth'),healthBusy=false;
function checkAttendanceHealth(){
 if(!getSecret()||healthBusy||document.visibilityState==='hidden')return;
 if(navigator.onLine===false){healthElement.textContent='オフラインです。未確認の記録は保持しています。接続後に「再確認」を押してください。';return;}
 healthBusy=true;
 verifySetupKey(getSecret()).then(function(status){
  if(!status||!status.ok){healthElement.textContent='受付キーを確認してください。';document.getElementById('setup').hidden=false;return;}
  if(!status.queueReady){healthElement.textContent='受付の準備が完了していません。管理者にお知らせください。';return;}
  var failed=Number(status.failed)||0,retry=Number(status.retry)||0,stalled=Number(status.pending)>0&&Date.now()-Number(status.lastRun||0)>300000;
  healthElement.textContent=failed?'入退室の記録後、一部の通知・ポイント処理に確認が必要です。管理者にお知らせください。':stalled?'入退室の記録後の処理が遅れています。管理者にお知らせください。':retry?'入退室の記録後、一部の通知・ポイント処理を再確認しています。':'';
 }).catch(function(){healthElement.textContent='サーバーへの接続を確認できません。記録済みの表示まで確認してください。';}).finally(function(){healthBusy=false;});
}
window.addEventListener('offline',checkAttendanceHealth);
window.addEventListener('online',checkAttendanceHealth);
setTimeout(checkAttendanceHealth,15000);setInterval(checkAttendanceHealth,120000);

startBtn.addEventListener('click',function(){if(qr&&!camStarted&&!starting)resumeAttendanceCamera();else startCamera();});save();receipts();

window.addEventListener('beforeunload',function(e){if(entries.some(function(x){return x.state!=='done'&&x.state!=='expired';})){e.preventDefault();e.returnValue='';}});

if(getSecret())startCamera();else{document.getElementById('setup').hidden=false;frameMsg.textContent='端末の設定を確認してください';state('error','端末の設定','受付キーを設定してください','上の初回設定欄に、教室用の受付キーを入力してください。');}

</script>

</body></html>
