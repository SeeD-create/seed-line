<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学習塾SeeD 入退室</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  body{font-family:-apple-system,"Segoe UI",sans-serif;margin:0;background:#0A2818;color:#fff;text-align:center}
  #wrap{max-width:560px;margin:0 auto;padding:0 12px 24px}
  h1{font-size:24px;margin:16px 0 2px;color:#8BC34A}
  .hint{color:#9fb3a6;font-size:15px;margin-bottom:10px}
  #reader{width:100%;border-radius:16px;overflow:hidden;background:#000}
  #frameMsg{font-size:14px;color:#cfe;margin:8px 0;min-height:18px}
  #status{margin:14px 0;border-radius:16px;padding:24px;background:#143A24;min-height:96px;display:flex;flex-direction:column;justify-content:center}
  .big{font-size:38px;font-weight:bold}
  .sub{font-size:17px;margin-top:8px;color:#cfe}
  .in{color:#7CFC9A}.out{color:#7EC8FF}.err{color:#FF8A8A}
  .pt{margin-top:10px;font-size:22px;color:#E2B852}
  button{font-size:17px;padding:13px 20px;border:0;border-radius:12px;background:#2E9E5B;color:#fff;margin:6px;cursor:pointer}
  .manual{margin-top:14px}
  .manual input{font-size:22px;padding:11px 14px;border-radius:10px;border:2px solid #2E9E5B;text-align:center;width:60%}
  #setup{display:none;margin:14px 0;border-radius:16px;padding:20px;background:#3A1414;text-align:left;font-size:15px;line-height:1.7}
  #setup b{color:#FFB4B4}
  a{color:#8BC34A;font-size:12px}
</style>
</head>
<body><div id="wrap">
  <h1>🌱 学習塾SeeD 入退室</h1>
  <div class="hint">カードを枠の中にかざしてね</div>
  <div id="reader"></div>
  <div id="frameMsg"></div>
  <button id="startBtn" style="display:none">▶ カメラを開始</button>
  <div id="status"><div class="sub">カメラを準備しています…</div></div>

  <!-- 合言葉が入っていないPCで開いたときだけ出る案内。ここでも入力はさせない -->
  <div id="setup">
    <b>このパソコンは、まだ設定が済んでいません。</b><br>
    塾ランチャーの「入退室スキャナ（カメラ版）」のリンクから開いてください。<br>
    そのリンクを1回開けば、以後このパソコンでは何も入力せずに使えます。
  </div>

  <div class="manual">
    <div class="sub">読めない時は手入力＋Enter（USBスキャナもここでOK）</div>
    <input id="code" autocomplete="off" placeholder="コード">
  </div>
</div>

<script>
  // ▼▼▼ ここだけ塾ごとに設定 ▼▼▼
  // GAS本番デプロイの /exec URL（末尾 /exec まで。?以降は付けない）
  var EXEC_URL = "https://script.google.com/macros/s/AKfycbztDdOm_W6RlbxVj-TfG7zxjxhspaTkaGoDvY2qqy8o_enAMRWbtQi9RGNRyndZNLfE/exec";
  // ▲▲▲ ここまで ▲▲▲
  // ⚠ 合言葉（ATTEND_SECRET）はここに書かない。このページは誰でも見られる公開ページなので、
  //   書いた瞬間に誰でも打刻できてしまう。合言葉はブックマークURLの ?secret= から受け取り、
  //   そのブラウザの localStorage にだけ置く（2026-09-07）。

  var st = document.getElementById('status');
  var frameMsg = document.getElementById('frameMsg');
  var codeEl = document.getElementById('code');
  var startBtn = document.getElementById('startBtn');
  var setupBox = document.getElementById('setup');
  var last = { code: null, t: 0 };

  // ── 合言葉 ──
  // 受付で人に打たせない（prompt は使わない）。URLに付いていれば保存し、
  // 次回以降はURL無しでも動く。保存できたらアドレスバーからは消す。
  var PRESET = '';
  try { PRESET = new URLSearchParams(location.search).get('secret') || ''; } catch (e) { PRESET = ''; }
  if (PRESET) {
    try { localStorage.setItem('attendSecret', PRESET); } catch (e) {}
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  }
  function getSecret() {
    if (PRESET) return PRESET;
    try { return localStorage.getItem('attendSecret') || ''; } catch (e) { return ''; }
  }

  // ── 音（読み取れたことを音で返す。受付は画面を見ていないので音が要る）──
  // AudioContext は最初のクリック/キー入力までブラウザが鳴らさないので、
  // どこかを1回触った時点で解錠しておく。
  var actx = null;
  function unlockAudio() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) {}
  }
  document.addEventListener('click', unlockAudio, { once: true });
  document.addEventListener('keydown', unlockAudio, { once: true });
  function beep() {
    try {
      if (!actx) return;
      var o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.value = 0.18; o.start();
      setTimeout(function () { o.stop(); }, 90);
    } catch (e) {}
  }

  // JSONP（<script>タグでGASを呼び、結果をコールバックで受ける＝CORS不要）
  var _i = 0;
  function jsonp(params, cb) {
    var name = '__cb' + (++_i);
    var s = document.createElement('script');
    var done = false;
    window[name] = function (data) { done = true; cb(data); cleanup(); };
    function cleanup() { try { delete window[name]; } catch (e) { window[name] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
    var q = Object.keys(params).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
    s.src = EXEC_URL + '?' + q + '&callback=' + name;
    s.onerror = function () { if (!done) { cb({ ok: false, message: '通信エラー' }); cleanup(); } };
    document.body.appendChild(s);
    setTimeout(function () { if (!done) { cb({ ok: false, message: 'タイムアウト' }); cleanup(); } }, 12000);
  }

  function render(r) {
    if (r && r.cooldown) {
      st.innerHTML = '<div class="big" style="color:#E2B852">⏳</div><div class="sub">' + r.message + '</div>';
      return;
    }
    if (!r || !r.ok) {
      var msg = (r && r.message) || '通信に失敗しました';
      // 「認証エラー」は受付では意味が通らないので、やることに言い換える
      if (msg === '認証エラー') {
        msg = 'このパソコンの設定が古いようです。塾ランチャーのリンクから開き直してください。';
        setupBox.style.display = 'block';
      }
      st.innerHTML = '<div class="big err">✕</div><div class="sub">' + msg + '</div>';
      return;
    }
    if (r.type === '入室') {
      st.innerHTML = '<div class="big in">🟢 入室</div><div class="sub">' + r.name + ' さん</div>';
    } else {
      var p = r.awarded > 0
        ? '<div class="pt">自習pt +' + r.awarded + ' / 残高' + r.balance + 'pt</div>'
        : '<div class="sub">滞在' + r.minutes + '分（加点は60分以上）</div>';
      st.innerHTML = '<div class="big out">🔵 退室</div><div class="sub">' + r.name + ' さん（滞在' + r.minutes + '分）</div>' + p;
    }
  }

  function submit(code) {
    if (!code) return;
    var sec = getSecret();
    if (!sec) {
      setupBox.style.display = 'block';
      st.innerHTML = '<div class="big err">✕</div><div class="sub">設定が済んでいません（下の案内を見てね）</div>';
      return;
    }
    st.innerHTML = '<div class="sub">処理中…</div>';
    jsonp({ action: 'checkin', code: code, secret: sec }, render);
  }

  function onDecoded(text) {
    var now = Date.now();
    if (text === last.code && now - last.t < 4000) return; // 同コード4秒クールダウン
    last = { code: text, t: now };
    beep();
    submit(String(text).trim());
  }

  function camErr(e) {
    startBtn.style.display = '';
    frameMsg.innerHTML = '<span class="err">カメラを開けませんでした（' + ((e && e.message) ? e.message : e) + '）。上のボタンを押すか、下の手入力をご利用ください。</span>';
    st.innerHTML = '<div class="sub">カメラが使えないときは、下の欄にコードを入れてEnter</div>';
  }

  /** 連続オートフォーカス。印刷カードは近距離なのでこれが無いとピントが合わない */
  function tuneFocus() {
    try {
      var v = document.querySelector('#reader video');
      if (!v || !v.srcObject) return;
      var t = v.srcObject.getVideoTracks()[0];
      if (t && t.applyConstraints) t.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
    } catch (e) {}
  }

  // ── カメラ起動 ──
  // 開いた時点で自動で始める。ボタンは自動起動に失敗したときだけ出す。
  // 設定はGAS版（?page=checkin）と同じ：fps30・枠は動画の8割・反転探索なし・
  // ブラウザ内蔵のBarcodeDetectorを使えるなら使う。fps10だと card をかざしても読めないことがある。
  var camStarted = false;
  function startCamera() {
    if (camStarted) return;
    camStarted = true;
    startBtn.style.display = 'none';
    unlockAudio();
    var qr = new Html5Qrcode('reader', {
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
      verbose: false
    });
    var qbox = function (vw, vh) {
      var s = Math.min(440, Math.floor(Math.min(vw, vh) * 0.8));
      return { width: s, height: s };
    };
    var cfg = {
      fps: 30, qrbox: qbox, disableFlip: true,
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    };
    function ok() {
      frameMsg.innerHTML = '📷 読み取り中…枠の中にカードをかざしてね';
      st.innerHTML = '<div class="sub">カードをかざしてください</div>';
      tuneFocus();
    }
    function fail(e) { camStarted = false; camErr(e); }
    Html5Qrcode.getCameras().then(function (devs) {
      var id = (devs && devs.length) ? devs[devs.length - 1].id : null;
      qr.start(id || { facingMode: 'environment' }, cfg, onDecoded, function () {}).then(ok).catch(fail);
    }).catch(function () {
      qr.start({ facingMode: 'environment' }, cfg, onDecoded, function () {}).then(ok).catch(fail);
    });
  }

  startBtn.addEventListener('click', startCamera);

  codeEl.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); var c = codeEl.value.trim(); codeEl.value = ''; submit(c); }
  });

  // 合言葉が無いPCではカメラを開かず、先に案内を出す（かざしても弾かれるだけなので）
  if (getSecret()) {
    startCamera();
  } else {
    setupBox.style.display = 'block';
    frameMsg.textContent = '';
    st.innerHTML = '<div class="sub">このパソコンは設定が済んでいません（下の案内を見てね）</div>';
  }
</script>
</body>
</html>
